name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked environment
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Run the verification gate (format, lint, secret scan, doc links, tests, CLI smoke run)
        run: make check
      - name: Reproduce the release evidence and compare checksums
        run: make reproduce
